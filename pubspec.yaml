name: wifi_scanner
description: A WiFi Network Scanner app that discovers devices on your local network.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  network_info_plus: ^6.0.1
  dart_ping: ^9.0.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
